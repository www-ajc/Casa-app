<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa · Equipamentos</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#1c2430; --muted:#6b7686; --line:#e3e7ed;
  --accent:#2563eb; --accent-soft:#eaf1fe; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --radius:12px; --shadow:0 1px 3px rgba(16,24,40,.08);
}

/* ===== identidade Almah ===== */
.marca-almah{
  background:linear-gradient(150deg,#2f5d3f 0%,#1b3826 100%);
  border-radius:var(--radius);padding:22px 24px;margin-bottom:14px;color:#fff;
  display:flex;align-items:center;gap:22px;flex-wrap:wrap
}
.marca-almah img{height:58px;width:auto;opacity:.95;flex-shrink:0}
.marca-almah .txt{flex:1;min-width:180px}
.marca-almah .tit{font-size:18px;font-weight:700;letter-spacing:-.2px;margin-bottom:3px}
.marca-almah .mor{font-size:13px;opacity:.72;line-height:1.45}
@media(max-width:520px){
  .marca-almah{gap:14px;padding:18px}
  .marca-almah img{height:44px}
}
.assina-ajc{
  display:inline-flex;align-items:center;gap:6px;vertical-align:middle;
  opacity:.62;transition:opacity .18s
}
.assina-ajc:hover{opacity:1}
.assina-ajc img{height:17px;width:auto}
.assina-ajc b{font-size:11px;letter-spacing:1.4px;font-weight:700;color:var(--muted)}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted);font-weight:500}
nav button.active{background:var(--accent-soft);color:var(--accent)}
main{max-width:1080px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:14px;margin:16px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.grid{display:grid;gap:12px}
.grid.cols3{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.grid.cols4{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.stat{padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);cursor:pointer}
.stat b{font-size:22px;display:block}
.stat span{color:var(--muted);font-size:13px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.badge.ok{background:#e7f6ec;color:var(--ok)} .badge.warn{background:#fdf0e0;color:var(--warn)} .badge.bad{background:#fdeaea;color:var(--bad)} .badge.grey{background:#eef0f3;color:var(--muted)} .badge.blue{background:var(--accent-soft);color:var(--accent)}
.equip-card{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);cursor:pointer;transition:border-color .15s}
.equip-card:hover{border-color:var(--accent)}
.thumb{width:52px;height:52px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.equip-card .info{flex:1;min-width:0}
.equip-card .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.equip-card .info small{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 14px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px;font-weight:600;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad);border-color:#f3c6c6}
.btn.small{padding:5px 10px;font-size:13px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:180px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:none;padding:9px 14px;cursor:pointer;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.3px}
.kv{display:grid;grid-template-columns:180px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;white-space:pre-wrap}
.alert-item{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;margin-bottom:6px;cursor:pointer}
.alert-item.warn{background:#fdf6ec} .alert-item.bad{background:#fdf0f0}
details{border:1px solid var(--line);border-radius:var(--radius);padding:0 14px;margin-bottom:10px;background:var(--card)}
details summary{padding:12px 0;font-weight:600;cursor:pointer;font-size:14px}
details[open]{padding-bottom:14px}
.muted{color:var(--muted)} .right{text-align:right} .mt{margin-top:12px}
.empty{text-align:center;padding:40px;color:var(--muted)}
.item-row{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.item-row:last-child{border-bottom:none}
.photo-preview{max-width:140px;max-height:140px;border-radius:10px;border:1px solid var(--line);display:block;margin-top:6px}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:20px}
/* ===== Acessibilidade ===== */
body.fs1{zoom:1.15} body.fs2{zoom:1.3}
body.contraste{--bg:#fff;--card:#fff;--ink:#000;--muted:#2f3a48;--line:#8b95a5;--shadow:none}
body.escuro{--bg:#11161d;--card:#1a212b;--ink:#e8edf4;--muted:#9aa7b8;--line:#2c3543;--accent-soft:#20304d;--shadow:0 1px 3px rgba(0,0,0,.5)}
body.escuro input,body.escuro select,body.escuro textarea{background:#11161d;color:var(--ink)}
body.escuro .badge.ok{background:#173427} body.escuro .badge.warn{background:#3a2a12} body.escuro .badge.bad{background:#3a1717} body.escuro .badge.grey{background:#242c37}
body.escuro .alert-item.warn{background:#2a2314} body.escuro .alert-item.bad{background:#2f1a1a}
.a11y{display:flex;gap:4px;align-items:center}
.a11y button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 9px;cursor:pointer;font-size:13px;font-weight:600}
.a11y button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.idx{display:flex;gap:2px;flex-wrap:wrap;margin:0 0 10px}
.idx button{border:1px solid var(--line);background:var(--card);color:var(--accent);min-width:26px;padding:3px 0;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:600}
.idx button:disabled{color:var(--line);cursor:default}
.grp-h{grid-column:1/-1;margin:6px 0 -4px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
@media(max-width:640px){.kv{grid-template-columns:1fr}.kv dt{margin-top:8px;font-size:12px}}
@media print{header,nav,.toolbar,.btn,footer{display:none!important}body{background:#fff}.card{box-shadow:none;border:none}}
</style>

let DB;
function migrar(novo,antigo){
  if(!antigo||!antigo.equipamentos)return novo;
  const porNome={};antigo.equipamentos.forEach(e=>porNome[e.nome]=e);
  novo.equipamentos.forEach(e=>{
    const o=porNome[e.nome];if(o)delete porNome[e.nome];if(!o)return;
    ["dataCompra","loja","preco","garantiaNotas","valorSubstituicao","fotoEquip","fotoEtiqueta","notas","comoFazer","utilidade","compartimento"].forEach(k=>{if((e[k]===""||e[k]==null)&&o[k])e[k]=o[k];});
    if(o.atualizadoTs)e.atualizadoTs=o.atualizadoTs;
    if(o.garantiaMeses&&o.garantiaMeses!==24&&e.garantiaMeses===24)e.garantiaMeses=o.garantiaMeses;
    if(o.avarias&&o.avarias.length&&!e.avarias.length)e.avarias=o.avarias;
    e.manutencoes.forEach(m=>{const om=(o.manutencoes||[]).find(x=>x.tarefa===m.tarefa);if(om&&om.ultima&&!m.ultima)m.ultima=om.ultima;});
  });
  // equipamentos criados manualmente na app (não existem na nova versão) são preservados
  Object.values(porNome).forEach(o=>{if(o.criadoManual)novo.equipamentos.push(o);});
  if(antigo.settings&&antigo.settings.tarifaKwh)novo.settings.tarifaKwh=antigo.settings.tarifaKwh;
  return novo;
}
function load(){
  let ant=null;try{ant=JSON.parse(localStorage.getItem(LS_KEY))}catch(e){}
  if(ant&&ant.seedV===SEED_V){DB=ant;return;}
  DB=migrar({seedV:SEED_V,settings:JSON.parse(JSON.stringify(DEFAULTS)),equipamentos:seed()},ant);
  if(ant&&ant.syncTs)DB.syncTs=ant.syncTs;
  save();
}
function save(){DB.syncTs=new Date().toISOString();localStorage.setItem(LS_KEY,JSON.stringify(DB));fileWriteDeb();nuvemPushDeb();}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtData=d=>d?new Date(d+"T00:00").toLocaleDateString("pt-PT"):"—";
const fmtEur=v=>v===""||v==null||isNaN(v)?"—":Number(v).toLocaleString("pt-PT",{style:"currency",currency:"EUR"});
function addMeses(iso,m){const d=new Date(iso+"T00:00");d.setMonth(d.getMonth()+Number(m));return d;}
function fimGarantia(e){if(!e.dataCompra||!e.garantiaMeses)return null;return addMeses(e.dataCompra,e.garantiaMeses);}
function estadoGarantia(e){
  const f=fimGarantia(e);if(!f)return{cls:"grey",txt:"Sem dados"};
  const dias=Math.floor((f-new Date())/864e5);
  if(dias<0)return{cls:"grey",txt:"Expirada "+f.toLocaleDateString("pt-PT")};
  if(dias<=60)return{cls:"warn",txt:"Expira em "+dias+" dias",dias};
  return{cls:"ok",txt:"Até "+f.toLocaleDateString("pt-PT")};
}
function proximaManut(m){if(!m.ultima)return null;return addMeses(m.ultima,m.freqMeses);}
function manutEstado(m){
  const p=proximaManut(m);if(!p)return{cls:"grey",txt:"Sem registo"};
  const dias=Math.floor((p-new Date())/864e5);
  if(dias<0)return{cls:"bad",txt:"Em atraso ("+p.toLocaleDateString("pt-PT")+")",dias};
  if(dias<=14)return{cls:"warn",txt:"Em "+dias+" dias",dias};
  return{cls:"ok",txt:p.toLocaleDateString("pt-PT")};
}
function completude(e){
  let t=0,p=0;const chk=v=>{t++;if(v!==""&&v!=null)p++;};
  ["marca","modelo","numeroSerie","dataCompra","compartimento","classeEnergetica","contactoAssistencia"].forEach(k=>chk(e[k]));
  return Math.round(p/t*100);
}
function alertas(){
  const out=[];
  DB.equipamentos.filter(e=>!e.arquivado).forEach(e=>{
    const g=estadoGarantia(e);
    if(g.cls==="warn")out.push({cls:"warn",eq:e,txt:"Garantia: "+g.txt});
    e.manutencoes.forEach(m=>{
      const s=manutEstado(m);
      if(s.cls==="bad")out.push({cls:"bad",eq:e,txt:m.tarefa+" — "+s.txt});
      else if(s.cls==="warn")out.push({cls:"warn",eq:e,txt:m.tarefa+" — "+s.txt});
    });
  });
  return out;
}
function comprimirImagem(file,cb){
  const r=new FileReader();
  r.onload=ev=>{const img=new Image();img.onload=()=>{
    const MAX=900;let w=img.width,h=img.height;
    if(w>MAX||h>MAX){const k=MAX/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
    const c=document.createElement("canvas");c.width=w;c.height=h;
    c.getContext("2d").drawImage(img,0,0,w,h);
    cb(c.toDataURL("image/jpeg",0.75));
  };img.src=ev.target.result;};
  r.readAsDataURL(file);
}

function vDash(){
  const eqs=DB.equipamentos.filter(e=>!e.arquivado);
  const al=alertas();
  const porCat={};eqs.forEach(e=>porCat[e.categoria]=(porCat[e.categoria]||0)+1);
  const incompletos=eqs.filter(e=>completude(e)<60).length;
  return MARCA_ALMAH + `
  <div class="grid cols4" style="margin-bottom:14px">
    <div class="stat" onclick='go({name:"lista"})'><b>${eqs.length}</b><span>Equipamentos</span></div>
    <div class="stat" onclick='go({name:"manut"})'><b style="color:${al.length?"var(--warn)":"var(--ok)"}">${al.length}</b><span>Alertas ativos</span></div>
    <div class="stat" onclick='go({name:"lista",fCompl:1})'><b>${incompletos}</b><span>Fichas por completar</span></div>
    <div class="stat" onclick='go({name:"energia"})'><b>${fmtEur(custoTotalAnual())}</b><span>Energia estimada/ano</span></div>
  </div>
  ${al.length?`<div class="card"><h2>⚠️ Alertas</h2>${al.map(a=>`<div class="alert-item ${a.cls}" onclick='go({name:"ficha",id:"${a.eq.id}",tab:"manut"})'><span class="badge ${a.cls}">${a.cls==="bad"?"Atraso":"Aviso"}</span> <b>${esc(a.eq.nome)}</b> <span class="muted">${esc(a.txt)}</span></div>`).join("")}</div>`:""}
  <div class="card"><h2>Por categoria</h2><div class="grid cols3">
    ${DB.settings.categorias.filter(c=>porCat[c]).map(c=>`<div class="stat" onclick='go({name:"lista",fCat:"${esc(c)}"})'><b>${ICONES[c]||"📦"} ${porCat[c]}</b><span>${esc(c)}</span></div>`).join("")}
  </div></div>
  <div style="text-align:center"><button class="btn primary" onclick='go({name:"form"})'>＋ Adicionar equipamento</button></div>`;
}

let LISTA_F={cat:"",comp:"",tipo:"",q:"",soIncompletos:false,arquivados:false,ord:"nome",agr:false};
function vLista(){
  if(VIEW.fCat!==undefined){LISTA_F.cat=VIEW.fCat||"";delete VIEW.fCat;}
  if(VIEW.fCompl!==undefined){LISTA_F.soIncompletos=true;delete VIEW.fCompl;}
  const f=LISTA_F;
  return `
  <div class="toolbar">
    <input type="search" placeholder="Pesquisar nome, marca, modelo, nº série…" value="${esc(f.q)}" oninput="LISTA_F.q=this.value;renderListaSo()">
    <button class="btn primary" onclick='go({name:"form"})'>＋ Adicionar</button>
  </div>
  <div class="chips">
    <select style="width:auto" onchange="LISTA_F.cat=this.value;render()"><option value="">Categoria: todas</option>${DB.settings.categorias.map(c=>`<option ${f.cat===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
    <select style="width:auto" onchange="LISTA_F.comp=this.value;render()"><option value="">Compartimento: todos</option>${DB.settings.compartimentos.map(c=>`<option ${f.comp===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
    <select style="width:auto" onchange="LISTA_F.tipo=this.value;render()"><option value="">Tipo: todos</option>${DB.settings.tipos.map(c=>`<option ${f.tipo===c?"selected":""}>${esc(c)}</option>`).join("")}</select>
    <span class="chip ${f.soIncompletos?"on":""}" onclick="LISTA_F.soIncompletos=!LISTA_F.soIncompletos;render()">Por completar</span>
    <span class="chip ${f.arquivados?"on":""}" onclick="LISTA_F.arquivados=!LISTA_F.arquivados;render()">Arquivados</span>
    <select style="width:auto" onchange="LISTA_F.ord=this.value;render()">
      <option value="nome" ${f.ord==="nome"?"selected":""}>Ordenar: nome (A–Z)</option>
      <option value="categoria" ${f.ord==="categoria"?"selected":""}>Ordenar: categoria</option>
      <option value="compartimento" ${f.ord==="compartimento"?"selected":""}>Ordenar: compartimento</option>
      <option value="ficha" ${f.ord==="ficha"?"selected":""}>Ordenar: ficha incompleta primeiro</option>
      <option value="garantia" ${f.ord==="garantia"?"selected":""}>Ordenar: fim de garantia</option>
    </select>
    <span class="chip ${f.agr?"on":""}" onclick="LISTA_F.agr=!LISTA_F.agr;render()">Agrupar por compartimento</span>
  </div>
  <div id="listaEqs">${htmlListaEqs(filtrarEqs())}</div>`;
}
function filtrarEqs(){
  const f=LISTA_F;
  let eqs=DB.equipamentos.filter(e=>f.arquivados?e.arquivado:!e.arquivado);
  if(f.cat)eqs=eqs.filter(e=>e.categoria===f.cat);
  if(f.comp)eqs=eqs.filter(e=>e.compartimento===f.comp);
  if(f.tipo)eqs=eqs.filter(e=>e.tipo===f.tipo);
  if(f.soIncompletos)eqs=eqs.filter(e=>completude(e)<60);
  if(f.q){const q=f.q.toLowerCase();eqs=eqs.filter(e=>[e.nome,e.marca,e.modelo,e.numeroSerie,e.referencia].join(" ").toLowerCase().includes(q));}
  const porNome=(a,b)=>a.nome.localeCompare(b.nome,"pt");
  const fimG=e=>{const x=fimGarantia(e);return x?x.getTime():Infinity;};
  const ord=f.ord||"nome";
  if(ord==="categoria")eqs.sort((a,b)=>(a.categoria||"").localeCompare(b.categoria||"","pt")||porNome(a,b));
  else if(ord==="compartimento")eqs.sort((a,b)=>(a.compartimento||"~").localeCompare(b.compartimento||"~","pt")||porNome(a,b));
  else if(ord==="ficha")eqs.sort((a,b)=>completude(a)-completude(b)||porNome(a,b));
  else if(ord==="garantia")eqs.sort((a,b)=>fimG(a)-fimG(b)||porNome(a,b));
  else eqs.sort(porNome);
  return eqs;
}
const letraDe=s=>{const l=(s||"#").normalize("NFD").replace(/[̀-ͯ]/g,"").charAt(0).toUpperCase();return /[A-Z]/.test(l)?l:"#";};
function saltarLetra(l){
  const el=document.querySelector(`.equip-card[data-l="${l}"]`);
  if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.style.outline="2px solid var(--accent)";setTimeout(()=>el.style.outline="",1600);}
}
function htmlListaEqs(eqs){
  if(!eqs.length)return `<div class="empty">Nenhum equipamento encontrado.</div>`;
  const card=e=>{
    const g=estadoGarantia(e),c=completude(e);
    return `<div class="equip-card" data-l="${letraDe(e.nome)}" onclick='go({name:"ficha",id:"${e.id}"})'>
      <div class="thumb">${e.fotoEquip?`<img src="${e.fotoEquip}">`:(ICONES[e.categoria]||"📦")}</div>
      <div class="info"><b>${esc(e.nome)}</b>
        <small>${esc([e.marca,e.modelo].filter(Boolean).join(" ")||"— sem marca/modelo —")}</small><br>
        <small class="muted">${esc(e.compartimento||"")}</small><br>
        <span class="badge ${g.cls}" style="margin-top:3px">${g.cls==="ok"?"Garantia ✓":g.cls==="warn"?"Garantia!":"Garantia?"}</span>
        ${c<60?`<span class="badge blue">Ficha ${c}%</span>`:""}
      </div></div>`;
  };
  let corpo;
  if(LISTA_F.agr){
    const ordem=[...DB.settings.compartimentos,""];
    const grupos={};eqs.forEach(e=>{const k=e.compartimento||"";(grupos[k]=grupos[k]||[]).push(e);});
    const chaves=Object.keys(grupos).sort((a,b)=>{const ia=ordem.indexOf(a),ib=ordem.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b,"pt");});
    corpo=chaves.map(k=>`<div class="grp-h">${esc(k||"Sem compartimento")} · ${grupos[k].length}</div>`+grupos[k].map(card).join("")).join("");
  }else corpo=eqs.map(card).join("");
  let idx="";
  if(!LISTA_F.agr&&(LISTA_F.ord||"nome")==="nome"&&eqs.length>8){
    const letras=new Set(eqs.map(e=>letraDe(e.nome)));
    idx=`<div class="idx">${"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(l=>`<button ${letras.has(l)?"":"disabled"} onclick="saltarLetra('${l}')">${l}</button>`).join("")}</div>`;
  }
  return idx+`<div class="grid cols3">${corpo}</div>`;
}
function renderListaSo(){$("#listaEqs").innerHTML=htmlListaEqs(filtrarEqs());}

function getEq(id){return DB.equipamentos.find(e=>e.id===id);}
function vFicha(id,tab){
  const e=getEq(id);if(!e)return `<div class="empty">Equipamento não encontrado.</div>`;
  const g=estadoGarantia(e);
  const tabs=[["geral","Geral"],["tecnica","Técnica"],["docs","Documentos"],["assist","Assistência"],["manut","Manutenção"],["iot","Conectividade"]];
  return `
  <div class="toolbar">
    <button class="btn small" onclick='go({name:"lista"})'>← Lista</button>
    <div style="flex:1"></div>
    <button class="btn small" onclick='go({name:"form",id:"${e.id}"})'>✏️ Editar</button>
    <button class="btn small" onclick='duplicarEq("${e.id}")'>⧉ Duplicar</button>
    <button class="btn small" onclick='arquivarEq("${e.id}")'>${e.arquivado?"↩︎ Restaurar":"🗄 Arquivar"}</button>
    <button class="btn small danger" onclick='apagarEq("${e.id}")'>🗑 Apagar</button>
  </div>
  <div class="card">
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      <div class="thumb" style="width:72px;height:72px;font-size:34px">${e.fotoEquip?`<img src="${e.fotoEquip}">`:(ICONES[e.categoria]||"📦")}</div>
      <div style="flex:1">
        <h2 style="margin:0">${esc(e.nome)}</h2>
        <div class="muted">${esc([e.marca,e.modelo,e.referencia].filter(Boolean).join(" · ")||"Marca/modelo por preencher")}</div>
        <div class="mt" style="margin-top:6px">
          <span class="badge blue">${esc(e.categoria)}</span>
          ${e.compartimento?`<span class="badge grey">${esc(e.compartimento)}</span>`:""}
          <span class="badge ${g.cls}">Garantia: ${g.txt}</span>
          <span class="badge ${completude(e)<60?"warn":"ok"}">Ficha ${completude(e)}%</span>
        </div>
      </div>
    </div>
  </div>
  <div class="tabs">${tabs.map(([k,l])=>`<button class="${tab===k?"active":""}" onclick='go({name:"ficha",id:"${e.id}",tab:"${k}"})'>${l}</button>`).join("")}</div>
  <div class="card">${fichaTab(e,tab)}</div>`;
}
function kv(pairs){return `<dl class="kv">${pairs.map(([k,v])=>`<dt>${k}</dt><dd>${v||"—"}</dd>`).join("")}</dl>`;}
function fichaTab(e,tab){
  if(tab==="geral")return kv([
    ["Marca",esc(e.marca)],["Modelo",esc(e.modelo)],["Referência",esc(e.referencia)],["Nº de série",esc(e.numeroSerie)],
    ["Categoria",esc(e.categoria)],["Tipo",esc(e.tipo)],["Compartimento",esc(e.compartimento)],["Utilidade",esc(e.utilidade)],
    ["Data de compra",fmtData(e.dataCompra)],["Loja",esc(e.loja)],["Preço",fmtEur(e.preco)],
    ["Garantia",e.garantiaMeses?e.garantiaMeses+" meses":"—"],["Fim de garantia",fimGarantia(e)?fimGarantia(e).toLocaleDateString("pt-PT"):"—"],
    ["Notas de garantia",esc(e.garantiaNotas)],["Valor de substituição",fmtEur(e.valorSubstituicao)],["Notas",esc(e.notas)]
  ])+(e.fotoEtiqueta?`<h3>Foto da etiqueta</h3><img class="photo-preview" src="${e.fotoEtiqueta}" style="max-width:320px;max-height:320px">`:"");
  if(tab==="tecnica")return kv([
    ["Características",esc(e.caracteristicas)],["Classe energética",esc(e.classeEnergetica)],
    ["Consumo anual",e.consumoAnualKwh?e.consumoAnualKwh+" kWh/ano ≈ "+fmtEur(e.consumoAnualKwh*DB.settings.tarifaKwh)+"/ano":"—"],
    ["Consumo por ciclo",e.consumoCicloKwh?e.consumoCicloKwh+" kWh":"—"],["Standby",e.standbyW?e.standbyW+" W":"—"],
    ["Consumo de água",esc(e.consumoAgua)],["Ruído",e.ruidoDb?e.ruidoDb+" dB":"—"],["Ligações",esc(e.ligacoes)]
  ]);
  if(tab==="docs"){
    const localDoc=`<p class="muted">📁 Arquivo local: pasta <b>Documentacao</b> ao lado desta app · <a href="Documentacao/Arquivo_Documentacao.html" target="_blank">abrir índice do arquivo</a></p>`;
    const links=localDoc+(e.links.length?`<table><tr><th>Documento</th><th>Ligação</th></tr>${e.links.map(l=>`<tr><td>${esc(l.label)}</td><td><a href="${esc(l.url)}" target="_blank">${esc(l.url)}</a></td></tr>`).join("")}</table>`:`<p class="muted">Sem documentos. Edita a ficha para adicionar ligações (manual, fatura, ficha técnica…).</p>`);
    return links+`<h3>Como fazer / dicas</h3><div style="white-space:pre-wrap">${esc(e.comoFazer)||"<span class='muted'>Sem notas.</span>"}</div>`;
  }
  if(tab==="assist"){
    const av=e.avarias.length?`<table><tr><th>Data</th><th>Descrição</th><th>Custo</th><th>Quem</th></tr>${e.avarias.map(a=>`<tr><td>${fmtData(a.data)}</td><td>${esc(a.descricao)}</td><td>${fmtEur(a.custo)}</td><td>${esc(a.quem)}</td></tr>`).join("")}</table>`:`<p class="muted">Sem avarias registadas. 🎉</p>`;
    return kv([["Contacto do fabricante",esc(e.contactoFabricante)],["Assistência técnica",esc(e.contactoAssistencia)],["Registo do produto",e.siteRegisto?`<a href="${esc(e.siteRegisto)}" target="_blank">${esc(e.siteRegisto)}</a>`:"—"]])+`<h3>Histórico de avarias/reparações</h3>`+av;
  }
  if(tab==="manut"){
    if(!e.manutencoes.length)return `<p class="muted">Sem tarefas de manutenção. Edita a ficha para adicionar.</p>`;
    return `<table><tr><th>Tarefa</th><th>Frequência</th><th>Última</th><th>Próxima</th><th></th></tr>${e.manutencoes.map((m,i)=>{
      const s=manutEstado(m);
      return `<tr><td><b>${esc(m.tarefa)}</b>${m.consumivel?`<br><small class="muted">Consumível: ${esc(m.consumivel)}</small>`:""}</td><td>${m.freqMeses} meses</td><td>${fmtData(m.ultima)}</td><td><span class="badge ${s.cls}">${s.txt}</span></td><td class="right"><button class="btn small" onclick='marcarFeita("${e.id}",${i})'>✓ Feita hoje</button></td></tr>`;
    }).join("")}</table>`;
  }
  if(tab==="iot")return kv([
    ["Ligação à rede",esc(e.rede)],["App do fabricante",esc(e.appFabricante)],["API disponível",esc(e.apiDisponivel)],
    ["Compatibilidades",esc(e.compatibilidades)],["Estado IoT",`<span class="badge ${e.estadoIot==="Controlável"?"ok":"grey"}">${esc(e.estadoIot)}</span>`]
  ])+`<p class="muted mt">Preparação para a Fase 4 — quando avançarmos para controlo IoT, os equipamentos "controláveis" ganham comandos aqui.</p>`;
  return "";
}
function marcarFeita(id,i){const e=getEq(id);e.manutencoes[i].ultima=new Date().toISOString().slice(0,10);e.atualizadoEm=e.manutencoes[i].ultima;e.atualizadoTs=new Date().toISOString();save();render();}
function duplicarEq(id){const e=getEq(id);const c=JSON.parse(JSON.stringify(e));c.id="e"+Date.now()+Math.random().toString(36).slice(2,6);c.nome=e.nome+" (cópia)";c.numeroSerie="";DB.equipamentos.push(c);save();go({name:"ficha",id:c.id});}
function arquivarEq(id){const e=getEq(id);e.arquivado=!e.arquivado;save();go({name:"lista"});}
function apagarEq(id){const e=getEq(id);if(confirm(`Apagar definitivamente "${e.nome}"? Esta ação não pode ser anulada.`)){DB.equipamentos=DB.equipamentos.filter(x=>x.id!==id);save();go({name:"lista"});}}
/* ================= FORMULÁRIO ================= */

  </div>
  <div class="row">
    <div><label>Foto do equipamento</label><input type="file" accept="image/*" onchange="fotoForm(this,'fotoEquip')">${e.fotoEquip?`<img class="photo-preview" id="pv_fotoEquip" src="${e.fotoEquip}">`:`<img class="photo-preview" id="pv_fotoEquip" style="display:none">`}</div>
    <div><label>Foto da etiqueta</label><input type="file" accept="image/*" onchange="fotoForm(this,'fotoEtiqueta')">${e.fotoEtiqueta?`<img class="photo-preview" id="pv_fotoEtiqueta" src="${e.fotoEtiqueta}">`:`<img class="photo-preview" id="pv_fotoEtiqueta" style="display:none">`}</div>
  </div></details>
  <details open><summary>Classificação</summary><div class="row">
    ${sel("categoria","Categoria",DB.settings.categorias)}${sel("tipo","Tipo",DB.settings.tipos)}${sel("compartimento","Compartimento",DB.settings.compartimentos)}${inp("utilidade","Utilidade")}
  </div></details>
  <details><summary>Aquisição e garantia</summary><div class="row">
    ${inp("dataCompra","Data de compra","date")}${inp("loja","Loja/fornecedor")}${inp("preco","Preço (€)","number",'step="0.01"')}${inp("garantiaMeses","Garantia (meses)","number")}${inp("valorSubstituicao","Valor de substituição (€)","number",'step="0.01"')}
  </div>${txt("garantiaNotas","Notas de garantia (extensão, seguro…)")}</details>
  <details><summary>Características técnicas</summary>
  ${txt("caracteristicas","Ficha técnica resumida (dimensões, capacidade, potência…)")}
  <div class="row">
    ${inp("classeEnergetica","Classe energética")}${inp("consumoAnualKwh","Consumo anual (kWh)","number",'step="0.1"')}${inp("consumoCicloKwh","Consumo/ciclo (kWh)","number",'step="0.01"')}${inp("standbyW","Standby (W)","number",'step="0.1"')}${inp("consumoAgua","Consumo de água")}${inp("ruidoDb","Ruído (dB)","number")}
  </div>${txt("ligacoes","Ligações (elétrica, água, esgoto, gás, rede)")}</details>
  <details><summary>Documentos e "Como fazer"</summary>
  <div id="linksBox">${linksHtml()}</div>
  <button class="btn small mt" onclick='DRAFT.links.push({label:"",url:""});$("#linksBox").innerHTML=linksHtml()'>＋ Ligação (manual, fatura…)</button>
  ${txt("comoFazer","Como fazer / dicas / programas favoritos")}</details>
  <details><summary>Assistência</summary><div class="row">
    ${inp("contactoFabricante","Contacto do fabricante")}${inp("contactoAssistencia","Assistência técnica")}${inp("siteRegisto","Site de registo do produto","url")}
  </div>
  <h3>Avarias/reparações</h3><div id="avariasBox">${avariasHtml()}</div>
  <button class="btn small mt" onclick='DRAFT.avarias.push({data:"",descricao:"",custo:"",quem:""});$("#avariasBox").innerHTML=avariasHtml()'>＋ Avaria</button></details>
  <details><summary>Manutenção periódica</summary><div id="manutBox">${manutHtml()}</div>
  <button class="btn small mt" onclick='DRAFT.manutencoes.push({tarefa:"",freqMeses:6,ultima:"",consumivel:""});$("#manutBox").innerHTML=manutHtml()'>＋ Tarefa</button></details>
  <details><summary>Conectividade (preparação IoT)</summary><div class="row">
    ${sel("rede","Ligação à rede",["Nenhuma","Wi-Fi","Ethernet","Bluetooth","Zigbee/Z-Wave","Outra"])}${inp("appFabricante","App do fabricante")}${inp("apiDisponivel","API / integração disponível")}${inp("compatibilidades","Compatibilidades (HA, HomeKit…)")}${sel("estadoIot","Estado IoT",["Não ligado","Ligado, sem controlo na app","Controlável"])}

function linksHtml(){return DRAFT.links.map((l,i)=>`<div class="item-row">
  <input placeholder="Nome (ex.: Manual PDF)" value="${esc(l.label)}" oninput='DRAFT.links[${i}].label=this.value' style="flex:1">
  <input placeholder="https://…" value="${esc(l.url)}" oninput='DRAFT.links[${i}].url=this.value' style="flex:2">
  <button class="btn small danger" onclick='DRAFT.links.splice(${i},1);$("#linksBox").innerHTML=linksHtml()'>✕</button></div>`).join("")||`<p class="muted">Sem ligações.</p>`;}
function avariasHtml(){return DRAFT.avarias.map((a,i)=>`<div class="item-row">
  <input type="date" value="${esc(a.data)}" oninput='DRAFT.avarias[${i}].data=this.value' style="max-width:150px">
  <input placeholder="Descrição" value="${esc(a.descricao)}" oninput='DRAFT.avarias[${i}].descricao=this.value' style="flex:2">
  <input type="number" step="0.01" placeholder="€" value="${esc(a.custo)}" oninput='DRAFT.avarias[${i}].custo=this.value' style="max-width:90px">
  <input placeholder="Quem reparou" value="${esc(a.quem)}" oninput='DRAFT.avarias[${i}].quem=this.value' style="flex:1">
  <button class="btn small danger" onclick='DRAFT.avarias.splice(${i},1);$("#avariasBox").innerHTML=avariasHtml()'>✕</button></div>`).join("")||`<p class="muted">Sem avarias.</p>`;}
function manutHtml(){return DRAFT.manutencoes.map((m,i)=>`<div class="item-row">
  <input placeholder="Tarefa" value="${esc(m.tarefa)}" oninput='DRAFT.manutencoes[${i}].tarefa=this.value' style="flex:2">
  <input type="number" min="1" title="Frequência em meses" value="${esc(m.freqMeses)}" oninput='DRAFT.manutencoes[${i}].freqMeses=this.value' style="max-width:80px">
  <input type="date" title="Última execução" value="${esc(m.ultima)}" oninput='DRAFT.manutencoes[${i}].ultima=this.value' style="max-width:150px">
  <input placeholder="Consumível (ref., onde comprar)" value="${esc(m.consumivel)}" oninput='DRAFT.manutencoes[${i}].consumivel=this.value' style="flex:2">
  <button class="btn small danger" onclick='DRAFT.manutencoes.splice(${i},1);$("#manutBox").innerHTML=manutHtml()'>✕</button></div>`).join("")||`<p class="muted">Sem tarefas.</p>`;}
function fotoForm(input,campo){
  const f=input.files[0];if(!f)return;
  comprimirImagem(f,url=>{DRAFT[campo]=url;const pv=$("#pv_"+campo);pv.src=url;pv.style.display="block";});
}
function gravarForm(){
  if(!DRAFT.nome.trim()){alert("O nome de exibição é obrigatório.");return;}
  DRAFT.links=DRAFT.links.filter(l=>l.label||l.url);
  DRAFT.avarias=DRAFT.avarias.filter(a=>a.descricao||a.data);
  DRAFT.manutencoes=DRAFT.manutencoes.filter(m=>m.tarefa);
  DRAFT.atualizadoEm=new Date().toISOString().slice(0,10);
  DRAFT.atualizadoTs=new Date().toISOString();
  const i=DB.equipamentos.findIndex(e=>e.id===DRAFT.id);
  if(i>=0)DB.equipamentos[i]=DRAFT;else{DRAFT.criadoManual=true;DB.equipamentos.push(DRAFT);}
  save();go({name:"ficha",id:DRAFT.id});
}
function cancelarForm(id){id?go({name:"ficha",id}):go({name:"lista"});}
/* ================= MANUTENÇÃO GLOBAL ================= */
function vManut(){
  const linhas=[];
  DB.equipamentos.filter(e=>!e.arquivado).forEach(e=>e.manutencoes.forEach((m,i)=>{
    const s=manutEstado(m);const p=proximaManut(m);
    linhas.push({e,m,i,s,ord:p?p.getTime():Infinity});
  }));
  linhas.sort((a,b)=>a.ord-b.ord);
  if(!linhas.length)return `<div class="empty">Sem tarefas de manutenção definidas.<br>Adiciona-as na ficha de cada equipamento.</div>`;
  return `<div class="card"><h2>🛠 Plano de manutenção</h2>
  <table><tr><th>Equipamento</th><th>Tarefa</th><th>Frequência</th><th>Última</th><th>Próxima</th><th></th></tr>
  ${linhas.map(({e,m,i,s})=>`<tr>
    <td><a href="#" onclick='go({name:"ficha",id:"${e.id}",tab:"manut"});return false'>${esc(e.nome)}</a></td>
    <td>${esc(m.tarefa)}</td><td>${m.freqMeses} m</td><td>${fmtData(m.ultima)}</td>
    <td><span class="badge ${s.cls}">${s.txt}</span></td>
    <td class="right"><button class="btn small" onclick='marcarFeita("${e.id}",${i});go({name:"manut"})'>✓ Feita</button></td></tr>`).join("")}
  </table></div>`;
}
/* ================= ENERGIA ================= */
function custoTotalAnual(){
  return DB.equipamentos.filter(e=>!e.arquivado&&e.consumoAnualKwh).reduce((s,e)=>s+Number(e.consumoAnualKwh)*DB.settings.tarifaKwh,0);
}
function vEnergia(){
  const eqs=DB.equipamentos.filter(e=>!e.arquivado&&e.consumoAnualKwh).sort((a,b)=>b.consumoAnualKwh-a.consumoAnualKwh);
  const semDados=DB.equipamentos.filter(e=>!e.arquivado&&!e.consumoAnualKwh).length;
  const total=custoTotalAnual();
  const max=eqs.length?Number(eqs[0].consumoAnualKwh):1;
  return `<div class="card"><h2>⚡ Consumos de energia</h2>
  <p class="muted">Tarifa: <b>${DB.settings.tarifaKwh} €/kWh</b> (alterar em Definições) · ${semDados?semDados+" equipamentos sem dados de consumo.":""}</p>
  ${eqs.length?`<table><tr><th>Equipamento</th><th>Classe</th><th>kWh/ano</th><th></th><th class="right">Custo/ano</th></tr>
  ${eqs.map(e=>`<tr>
    <td><a href="#" onclick='go({name:"ficha",id:"${e.id}",tab:"tecnica"});return false'>${esc(e.nome)}</a></td>
    <td>${esc(e.classeEnergetica)||"—"}</td><td>${e.consumoAnualKwh}</td>
    <td style="min-width:120px"><div style="height:8px;border-radius:4px;background:var(--accent);width:${Math.max(4,Math.round(e.consumoAnualKwh/max*100))}%"></div></td>
    <td class="right">${fmtEur(e.consumoAnualKwh*DB.settings.tarifaKwh)}</td></tr>`).join("")}
  <tr><td colspan="4"><b>Total estimado</b></td><td class="right"><b>${fmtEur(total)}</b></td></tr></table>`
  :`<div class="empty">Ainda sem dados de consumo.<br>Preenche o campo "Consumo anual (kWh)" nas fichas — vem nas etiquetas energéticas.</div>`}
  </div>`;
}
/* ================= DEFINIÇÕES ================= */

    :`<p class="muted">Liga a app ao ficheiro <b>casa-equipamentos-dados.json</b> (idealmente numa pasta iCloud Drive ou Google Drive): a app lê-o ao abrir e grava nele a cada alteração — sem exportar/importar manual.</p><button class="btn primary" onclick="ligarFicheiro()">🔗 Ligar ficheiro de dados</button>`}
  </div>`:``;
  const nuvemCard=`<div class="card"><h2>☁️ Sincronização na nuvem</h2>
    ${nuvemCfgOk()
      ?`<p>Ligado a <b>${esc(NUVEM.user)}/${esc(NUVEM.repo)}</b> · ${esc(NUVEM_ESTADO.txt||"ainda sem sincronização nesta sessão")}</p>
        <p class="muted">Os dados são encriptados neste aparelho antes de serem enviados — só quem tem a palavra-passe da casa os consegue ler.</p>
        <button class="btn primary" onclick="nuvemPull(true)">Sincronizar agora</button>
        <button class="btn" onclick="nuvemForcar()">Forçar envio deste aparelho</button>
        <button class="btn" onclick="nuvemConfigurar()">Alterar configuração</button>
        <button class="btn danger" onclick="nuvemDesligar()">Desligar</button>`
      :`<p class="muted">Sincroniza os dados entre Mac, iPhone e iPad através de um repositório privado no GitHub, com encriptação ponta-a-ponta. Precisas dos 4 dados indicados no guia de publicação.</p>
        <button class="btn primary" onclick="nuvemConfigurar()">Configurar sincronização</button>`}
  </div>`;
  return nuvemCard+syncCard+`
  <div class="card"><h2>💾 Backup e dados</h2>
    <p class="muted">A sincronização na nuvem trata do dia a dia entre aparelhos. Este cartão é a rede de segurança: exporta de vez em quando um backup JSON para local seguro — protege contra apagões acidentais (que a sincronização replicaria) e contra a perda da palavra-passe de encriptação.</p>
    <button class="btn primary" onclick="exportarJSON()">⬇ Exportar dados (JSON)</button>

}
async function exportarJSON(){
  const nome="casa-equipamentos-backup-"+new Date().toISOString().slice(0,10)+".json";
  const dados=JSON.stringify(DB,null,2);
  if("showSaveFilePicker" in window){
    try{
      const h=await window.showSaveFilePicker({suggestedName:nome,types:[{description:"Dados da app (JSON)",accept:{"application/json":[".json"]}}]});
      const w=await h.createWritable();await w.write(dados);await w.close();
      alert("Exportado para: "+h.name);return;
    }catch(e){if(e.name==="AbortError")return;}
  }
  const blob=new Blob([dados],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=nome;a.click();
}

/* ===== SINCRONIZAÇÃO POR FICHEIRO (File System Access API) ===== */
let FILE_HANDLE=null,FS_TIMER=null,PEDIR_RETOMA=false;
const FS_OK=typeof window!=="undefined"&&"showOpenFilePicker" in window;
function idb(){return new Promise((res,rej)=>{const q=indexedDB.open("casaEquipFS",1);q.onupgradeneeded=()=>q.result.createObjectStore("h");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function idbSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("h","readwrite");t.objectStore("h").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("h","readonly");const r=t.objectStore("h").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function ligarFicheiro(){
  if(!FS_OK){alert("O Safari não suporta ligação direta a ficheiros. Continua a usar Exportar/Importar aqui, ou abre esta app no Chrome/Edge para gravação automática no ficheiro.");return;}
  try{
    const [h]=await window.showOpenFilePicker({types:[{description:"Dados da app (JSON)",accept:{"application/json":[".json"]}}]});
    if(await h.requestPermission({mode:"readwrite"})!=="granted")return;
    let adotou=false;
    try{const d=JSON.parse(await (await h.getFile()).text());
      if(d.equipamentos&&d.settings&&confirm("Usar os dados deste ficheiro ("+d.equipamentos.length+" equipamentos) como fonte principal? (Cancelar mantém os dados atuais e grava-os por cima do ficheiro)")){DB=d;localStorage.setItem(LS_KEY,JSON.stringify(DB));adotou=true;}
    }catch(e){/* ficheiro vazio/novo */}
    FILE_HANDLE=h;await idbSet("dataFile",h);
    if(!adotou)await fileWrite();
    PEDIR_RETOMA=false;render();
  }catch(e){if(e.name!=="AbortError")alert("Não foi possível ligar: "+e.message);}
}
async function desligarFicheiro(){FILE_HANDLE=null;PEDIR_RETOMA=false;await idbSet("dataFile",null);render();}
async function fileWrite(){
  if(!FILE_HANDLE)return;
  try{const w=await FILE_HANDLE.createWritable();await w.write(JSON.stringify(DB,null,2));await w.close();}
  catch(e){console.warn("Gravação no ficheiro falhou:",e);}
}
function fileWriteDeb(){if(typeof FILE_HANDLE==="undefined"||!FILE_HANDLE)return;clearTimeout(FS_TIMER);FS_TIMER=setTimeout(fileWrite,600);}
async function retomarFicheiro(){
  const h=await idbGet("dataFile");if(!h){PEDIR_RETOMA=false;render();return;}
  if(await h.requestPermission({mode:"readwrite"})!=="granted")return;
  try{const d=JSON.parse(await (await h.getFile()).text());if(d.equipamentos&&d.settings){DB=d;localStorage.setItem(LS_KEY,JSON.stringify(DB));}}catch(e){}
  FILE_HANDLE=h;PEDIR_RETOMA=false;render();
}
async function arranqueFicheiro(){
  if(!FS_OK)return;
  try{
    const h=await idbGet("dataFile");if(!h)return;
    if(await h.queryPermission({mode:"readwrite"})==="granted"){
      try{const d=JSON.parse(await (await h.getFile()).text());if(d.equipamentos&&d.settings){DB=d;localStorage.setItem(LS_KEY,JSON.stringify(DB));}}catch(e){}
      FILE_HANDLE=h;render();
    }else{PEDIR_RETOMA=true;render();}
  }catch(e){}
}
/* ===== SINCRONIZAÇÃO NA NUVEM (GitHub + encriptação AES-GCM) ===== */
const NUVEM_KEY="casaEquip_nuvem";
let NUVEM={user:"",repo:"",token:"",pass:""};
try{Object.assign(NUVEM,JSON.parse(localStorage.getItem(NUVEM_KEY))||{})}catch(e){}
let NUVEM_ESTADO={txt:"",ok:null};
let NUVEM_TIMER=null,NUVEM_SHA=null,NUVEM_BUSY=false,NUVEM_ULTPULL=0;
const nuvemCfgOk=()=>!!(NUVEM.user&&NUVEM.repo&&NUVEM.token&&NUVEM.pass);
function nuvemGravarCfg(){localStorage.setItem(NUVEM_KEY,JSON.stringify(NUVEM));}
function syncDot(){const el=document.getElementById("syncdot");if(!el)return;
  el.textContent=nuvemCfgOk()?(NUVEM_ESTADO.ok===false?"⚠️":NUVEM_ESTADO.ok===true?"☁️":"⏳"):"";
  el.title=NUVEM_ESTADO.txt||"";}
const b64buf=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function nuvemChave(pass,salt){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:210000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function nuvemCifrar(txt,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const k=await nuvemChave(pass,salt);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(txt));
  return{v:1,salt:b64buf(salt),iv:b64buf(iv),ct:b64buf(ct)};
}
async function nuvemDecifrar(p,pass){
  const k=await nuvemChave(pass,unb64(p.salt));
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(p.iv)},k,unb64(p.ct));
  return new TextDecoder().decode(pt);
}
const nuvemUrl=()=>`https://api.github.com/repos/${NUVEM.user}/${NUVEM.repo}/contents/dados.enc.json`;
const nuvemHead=()=>({Authorization:"Bearer "+NUVEM.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
async function nuvemLerRemoto(){
  const r=await fetch(nuvemUrl()+"?t="+Date.now(),{headers:nuvemHead(),cache:"no-store"});
  if(r.status===404){NUVEM_SHA=null;return null;}
  if(r.status===401||r.status===403)throw new Error("token inválido ou sem permissões ("+r.status+")");
  if(!r.ok)throw new Error("GitHub respondeu "+r.status);
  const j=await r.json();NUVEM_SHA=j.sha;
  return JSON.parse(new TextDecoder().decode(unb64(j.content.replace(/\s/g,""))));
}
async function nuvemPull(interativo){
  if(!nuvemCfgOk())return;
  NUVEM_ULTPULL=Date.now();
  try{
    NUVEM_ESTADO={txt:"A verificar a nuvem…",ok:null};syncDot();
    const p=await nuvemLerRemoto();
    if(p){
      let d;
      try{d=JSON.parse(await nuvemDecifrar(p,NUVEM.pass));}
      catch(e){throw new Error("palavra-passe de encriptação errada?");}
      if(d.equipamentos&&d.settings){
        if(d.seedV!==SEED_V)d=migrar({seedV:SEED_V,settings:JSON.parse(JSON.stringify(DEFAULTS)),equipamentos:seed()},d);
        const remTs=d.syncTs||"",locTs=DB.syncTs||"";
        const remNovo=remTs>locTs;
        const antes=JSON.stringify(DB.equipamentos)+JSON.stringify(DB.settings);
        DB={seedV:SEED_V,settings:remNovo?d.settings:DB.settings,
            equipamentos:fundirEquipamentos(DB.equipamentos,d.equipamentos,remNovo),
            syncTs:remNovo?remTs:locTs};
        localStorage.setItem(LS_KEY,JSON.stringify(DB));
        if(JSON.stringify(DB.equipamentos)+JSON.stringify(DB.settings)!==antes)render();
        if(JSON.stringify(DB.equipamentos)!==JSON.stringify(d.equipamentos)||JSON.stringify(DB.settings)!==JSON.stringify(d.settings)){await nuvemPush();return;}
      }
    }else{await nuvemPush();return;}
    NUVEM_ESTADO={txt:"Sincronizado às "+new Date().toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"}),ok:true};syncDot();
  }catch(e){
    NUVEM_ESTADO={txt:"Falha: "+e.message,ok:false};syncDot();
    if(interativo)alert("Sincronização falhou — "+e.message);
  }
}
async function nuvemPush(){
  if(!nuvemCfgOk()||NUVEM_BUSY)return;NUVEM_BUSY=true;
  try{
    NUVEM_ESTADO={txt:"A enviar para a nuvem…",ok:null};syncDot();
    const payload=await nuvemCifrar(JSON.stringify(DB),NUVEM.pass);
    payload.ts=DB.syncTs||new Date().toISOString();payload.n=DB.equipamentos.length;
    const body={message:"Atualização "+payload.ts,content:btoa(unescape(encodeURIComponent(JSON.stringify(payload))))};
    if(NUVEM_SHA)body.sha=NUVEM_SHA;
    let r=await fetch(nuvemUrl(),{method:"PUT",headers:nuvemHead(),body:JSON.stringify(body)});
    if(r.status===409||r.status===422){
      await nuvemLerRemoto();
      if(NUVEM_SHA)body.sha=NUVEM_SHA;else delete body.sha;
      r=await fetch(nuvemUrl(),{method:"PUT",headers:nuvemHead(),body:JSON.stringify(body)});
    }
    if(r.status===401||r.status===403)throw new Error("token inválido ou sem permissões ("+r.status+")");
    if(!r.ok)throw new Error("GitHub respondeu "+r.status);
    const j=await r.json();if(j.content&&j.content.sha)NUVEM_SHA=j.content.sha;
    NUVEM_ESTADO={txt:"Sincronizado às "+new Date().toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"}),ok:true};syncDot();
  }catch(e){NUVEM_ESTADO={txt:"Falha ao enviar: "+e.message,ok:false};syncDot();}
  finally{NUVEM_BUSY=false;}
}
function nuvemPushDeb(){if(typeof NUVEM==="undefined"||!nuvemCfgOk())return;clearTimeout(NUVEM_TIMER);NUVEM_TIMER=setTimeout(nuvemPush,2500);}
/* Fusão ficha a ficha: para cada equipamento vence a versão editada mais recentemente.
   Em empate (sem carimbo), vence o lado cuja base de dados é globalmente mais recente. */
function fundirEquipamentos(locEqs,remEqs,remNovo){
  const ts=e=>e.atualizadoTs||"";
  const out=locEqs.slice();
  remEqs.forEach(r=>{
    let i=out.findIndex(e=>e.id===r.id);
    if(i<0)i=out.findIndex(e=>e.nome===r.nome);
    if(i<0){out.push(r);return;}
    const a=ts(out[i]),b=ts(r);
    if(b>a||(b===a&&remNovo))out[i]=r;
  });
  return out;
}
function nuvemForcar(){
  if(!confirm("Enviar os dados DESTE aparelho para a nuvem, sobrepondo-os aos que lá estão? Usa isto no aparelho que tem a informação completa."))return;
  DB.syncTs=new Date().toISOString();
  DB.equipamentos.forEach(e=>{e.atualizadoTs=DB.syncTs;});
  localStorage.setItem(LS_KEY,JSON.stringify(DB));
  nuvemPush();
}

  alert("Vais precisar de 4 dados (ver guia): utilizador GitHub, nome do repositório privado de dados, token de acesso e a palavra-passe de encriptação da casa.");
  const u=prompt("1/4 · Utilizador GitHub:",NUVEM.user||"");if(u==null)return;

  const p=prompt("4/4 · Palavra-passe de encriptação (tem de ser IGUAL em todos os aparelhos):",NUVEM.pass||"");if(p==null)return;
  NUVEM={user:u.trim(),repo:r.trim(),token:t.trim(),pass:p};nuvemGravarCfg();syncDot();
  await nuvemPull(true);render();
}
function nuvemDesligar(){
  if(!confirm("Desligar a sincronização neste aparelho? (Os dados locais e da nuvem não são apagados.)"))return;
  NUVEM={user:"",repo:"",token:"",pass:""};nuvemGravarCfg();NUVEM_ESTADO={txt:"",ok:null};syncDot();render();
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&nuvemCfgOk()&&Date.now()-NUVEM_ULTPULL>60000)nuvemPull();});
window.addEventListener("online",()=>{if(nuvemCfgOk())nuvemPull();});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
/* ================= ARRANQUE ================= */
load();render();arranqueFicheiro();syncDot();if(nuvemCfgOk())nuvemPull();
(function(){const v=document.getElementById("appv");if(v)v.textContent="v"+SEED_V;})();
</script>
